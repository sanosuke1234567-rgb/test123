<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div>
        <h1>贪吃蛇</h1>
        <p>方向键移动，空格开始/暂停，R 重开。</p>
      </div>
      <div class="scoreboard">
        <div>
          <span class="label">得分</span>
          <span id="score" class="value">0</span>
        </div>
        <div>
          <span class="label">最高分</span>
          <span id="best" class="value">0</span>
        </div>
      </div>
    </header>

    <section class="game">
      <canvas id="board" width="480" height="480" aria-label="贪吃蛇棋盘"></canvas>
      <div class="panel">
        <button id="toggle" class="btn">开始</button>
        <button id="restart" class="btn btn--ghost">重开</button>
        <div class="status" id="status">等待开始</div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
